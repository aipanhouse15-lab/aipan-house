<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Four beginner Aipan practice designs: dots and borders</title>
  <desc id="desc">Dot-chain, double dot-chain, corner clusters and a double square frame, drawn in white on geru-red tiles.</desc>
  <rect width="1000" height="650" rx="24" fill="#f7f3eb"/>
  <g font-family="Arial,sans-serif" font-size="23" fill="#493a31" text-anchor="middle">
    <text x="250" y="42">1 · Dot-chain</text><text x="750" y="42">2 · Double dots</text>
    <text x="250" y="354">3 · Corner clusters</text><text x="750" y="354">4 · Double frame</text>
  </g>
  <g fill="#a84e36" stroke="#d9c8ac" stroke-width="3">
    <rect x="35" y="60" width="430" height="260" rx="14"/><rect x="535" y="60" width="430" height="260" rx="14"/>
    <rect x="35" y="372" width="430" height="240" rx="14"/><rect x="535" y="372" width="430" height="240" rx="14"/>
  </g>
  <g fill="#fff8e9">
    <circle cx="130" cy="190" r="8"/><circle cx="180" cy="190" r="8"/><circle cx="230" cy="190" r="8"/><circle cx="280" cy="190" r="8"/><circle cx="330" cy="190" r="8"/><circle cx="380" cy="190" r="8"/><circle cx="430" cy="190" r="8"/>
    <circle cx="630" cy="155" r="8"/><circle cx="680" cy="155" r="8"/><circle cx="730" cy="155" r="8"/><circle cx="780" cy="155" r="8"/><circle cx="830" cy="155" r="8"/><circle cx="880" cy="155" r="8"/>
    <circle cx="655" cy="215" r="8"/><circle cx="705" cy="215" r="8"/><circle cx="755" cy="215" r="8"/><circle cx="805" cy="215" r="8"/><circle cx="855" cy="215" r="8"/><circle cx="905" cy="215" r="8"/>
    <circle cx="120" cy="445" r="8"/><circle cx="145" cy="445" r="8"/><circle cx="170" cy="445" r="8"/><circle cx="120" cy="470" r="8"/><circle cx="145" cy="470" r="8"/><circle cx="170" cy="470" r="8"/>
    <circle cx="330" cy="445" r="8"/><circle cx="355" cy="445" r="8"/><circle cx="380" cy="445" r="8"/><circle cx="330" cy="470" r="8"/><circle cx="355" cy="470" r="8"/><circle cx="380" cy="470" r="8"/>
    <circle cx="120" cy="530" r="8"/><circle cx="145" cy="530" r="8"/><circle cx="170" cy="530" r="8"/><circle cx="120" cy="555" r="8"/><circle cx="145" cy="555" r="8"/><circle cx="170" cy="555" r="8"/>
    <circle cx="330" cy="530" r="8"/><circle cx="355" cy="530" r="8"/><circle cx="380" cy="530" r="8"/><circle cx="330" cy="555" r="8"/><circle cx="355" cy="555" r="8"/><circle cx="380" cy="555" r="8"/>
  </g>
  <g fill="none" stroke="#fff8e9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="635" y="445" width="230" height="100"/><rect x="660" y="470" width="180" height="50"/>
  </g>
</svg>
